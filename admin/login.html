<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Padel Kita Jogja</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root { --ink:#0D0D0B; --paper:#F4F2EC; --border:#D6D3CB; --mid:#78786E; --lime:#C6F53E; --red:#E53E3E; --gold:#C19A4D; }
    body { font-family:'DM Sans',sans-serif; background:var(--paper); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { background:#fff; border:1px solid var(--border); border-radius:20px; padding:44px 40px; width:100%; max-width:400px; }
    .logo { display:flex; align-items:center; gap:10px; margin-bottom:36px; }
    .logo-mark { width:40px; height:40px; border-radius:10px; background:var(--lime); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:800; color:var(--ink); }
    .logo-name { font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:700; }
    .logo-sub { font-size:10px; color:var(--mid); font-family:'Space Grotesk',sans-serif; letter-spacing:.1em; text-transform:uppercase; }
    h1 { font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; margin-bottom:6px; }
    .sub { font-size:13px; font-weight:300; color:var(--mid); margin-bottom:28px; }
    label { display:block; font-family:'Space Grotesk',sans-serif; font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--mid); margin-bottom:7px; }
    input { width:100%; padding:12px 15px; border:1.5px solid var(--border); border-radius:8px; font-family:'DM Sans',sans-serif; font-size:14px; color:var(--ink); outline:none; margin-bottom:18px; transition:border-color .2s; }
    input:focus { border-color:var(--ink); }
    .btn { width:100%; padding:13px; background:var(--ink); color:#fff; border:none; border-radius:8px; font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; transition:background .2s; }
    .btn:hover { background:#1A1A16; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .error { background:rgba(229,62,62,.08); border:1px solid rgba(229,62,62,.25); border-radius:8px; padding:10px 14px; font-size:13px; color:var(--red); margin-bottom:16px; display:none; }
    .info { background:rgba(198,245,62,.12); border:1px solid rgba(198,245,62,.3); border-radius:8px; padding:10px 14px; font-size:12px; color:#4a6b1a; margin-bottom:16px; display:none; }
    .back { display:block; text-align:center; margin-top:20px; font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:500; color:var(--mid); text-decoration:none; transition:color .2s; }
    .back:hover { color:var(--ink); }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">PK</div>
    <div>
      <div class="logo-name">Padel Kita Jogja</div>
      <div class="logo-sub">Admin Panel</div>
    </div>
  </div>
  <h1>Masuk</h1>
  <p class="sub">Login khusus untuk admin &amp; staff</p>
  <div class="error" id="errMsg"></div>
  <div class="info" id="infoMsg"></div>
  <form id="loginForm">
    <label>Email</label>
    <input type="email" name="email" placeholder="admin@padelkitajogja.id" required autocomplete="email">
    <label>Password</label>
    <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
    <button type="submit" class="btn" id="btnLogin">Masuk</button>
  </form>
  <a href="/" class="back">← Kembali ke Website</a>
</div>

<script type="module">
import { supabase } from '../js/supabase.js';

const errEl  = document.getElementById('errMsg');
const infoEl = document.getElementById('infoMsg');
const btn    = document.getElementById('btnLogin');

function showErr(msg)  { errEl.textContent = msg; errEl.style.display = 'block'; infoEl.style.display = 'none'; }
function showInfo(msg) { infoEl.textContent = msg; infoEl.style.display = 'block'; errEl.style.display = 'none'; }

// Sudah login? cek admin lalu redirect
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) return;
  const { data: admin } = await supabase
    .from('admins').select('id').eq('id', session.user.id).maybeSingle();
  if (admin) location.replace('/admin/index.html');
})();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email    = e.target.email.value.trim();
  const password = e.target.password.value;

  btn.disabled = true; btn.textContent = 'Masuk...';
  errEl.style.display = 'none';

  // 1. Sign in
  const { data: authData, error: authErr } = await supabase.auth.signInWithPassword({ email, password });
  if (authErr) {
    showErr(authErr.message === 'Invalid login credentials' ? 'Email atau password salah.' : authErr.message);
    btn.disabled = false; btn.textContent = 'Masuk';
    return;
  }

  const userId = authData?.user?.id;
  if (!userId) {
    showErr('Gagal mendapatkan data user.');
    btn.disabled = false; btn.textContent = 'Masuk';
    return;
  }

  // 2. Cek apakah user terdaftar sebagai admin (pakai id dari hasil sign-in)
  const { data: admin, error: adminErr } = await supabase
    .from('admins').select('id, name, role').eq('id', userId).maybeSingle();

  if (adminErr) {
    showErr('Gagal verifikasi admin: ' + adminErr.message);
    btn.disabled = false; btn.textContent = 'Masuk';
    return;
  }

  if (!admin) {
    await supabase.auth.signOut();
    showErr('Akun ini tidak memiliki akses admin.');
    btn.disabled = false; btn.textContent = 'Masuk';
    return;
  }

  // 3. Berhasil
  showInfo('Berhasil masuk. Mengalihkan...');
  location.replace('/admin/index.html');
});
</script>
</body>
</html>
