[build]
  publish = "."

# Redirect: halaman booking & admin
[[redirects]]
  from = "/booking/*"
  to = "/index.html"
  status = 200

# Headers keamanan & cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback untuk admin
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
